<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexPrep AI - Test Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #fefce8 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 glass-card p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">ApexPrep <span class="text-blue-600">AI</span></h1>
                <p class="text-sm text-gray-500 font-medium">UPSC CSE Prelims</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-mono">Test ID: 1b8906</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                <p class="text-gray-500 text-xs uppercase tracking-wider font-semibold">Total Score</p>
                <div class="flex items-baseline gap-2">
                    <h2 class="text-4xl font-bold text-gray-900">-0.66</h2>
                    <span class="text-gray-400 text-sm">/ 200</span>
                </div>
                <p class="text-red-500 text-xs mt-2 mt-1">● Needs Improvement</p>
            </div>

            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                <p class="text-gray-500 text-xs uppercase tracking-wider font-semibold">Accuracy</p>
                <h2 class="text-4xl font-bold text-gray-900">0%</h2>
                <div class="w-full bg-gray-200 rounded-full h-1.5 mt-4">
                    <div class="bg-blue-500 h-1.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-gray-500 text-xs uppercase tracking-wider font-semibold">Duration</p>
                <h2 class="text-4xl font-bold text-gray-900">120</h2>
                <p class="text-gray-400 text-xs mt-1">Minutes Allotted</p>
            </div>
        </div>

<div class="min-h-screen bg-slate-50 p-4 md:p-8 font-sans">
  <header class="max-w-5xl mx-auto flex flex-wrap justify-between items-center bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-slate-200 shadow-sm mb-8">
    <div class="flex items-center gap-2">
      <span class="text-2xl font-black tracking-tight text-slate-800">ApexPrep <span class="text-blue-600 underline decoration-blue-200">AI</span></span>
    </div>
    <div class="text-right">
      <p class="text-xs font-bold uppercase tracking-widest text-slate-400">UPSC CSE Prelims : History</p>
      <p class="text-sm font-mono text-slate-600">Test ID: <span class="font-bold">88d6a3</span></p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-1"></div>
    
    <div class="p-8 md:p-12">
      <h1 class="text-2xl font-bold text-slate-800 mb-10 text-center uppercase tracking-wide">Performance Overview</h1>
      
      <div class="flex flex-col lg:flex-row items-center gap-12">
        <div class="relative flex items-center justify-center w-48 h-48">
          <svg class="w-full h-full transform -rotate-90">
            <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12" fill="transparent" class="text-slate-100" />
            <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12" fill="transparent" stroke-dasharray="552.92" stroke-dashoffset="535" class="text-blue-600 stroke-round transition-all duration-1000" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-4xl font-black text-slate-800">6.02</span>
            <span class="text-slate-400 font-medium border-t border-slate-200 pt-1 mt-1">/ 200</span>
          </div>
        </div>

        <div class="flex-1 grid grid-cols-2 md:grid-cols-4 gap-6 w-full">
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase mb-2">Attempt %</p>
            <p class="text-2xl font-bold text-slate-800">7%</p>
          </div>
          <div class="bg-green-50 p-5 rounded-2xl border border-green-100">
            <p class="text-xs font-bold text-green-600 uppercase mb-2">Accuracy</p>
            <p class="text-2xl font-bold text-green-700">57%</p>
          </div>
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase mb-2">Total Qs</p>
            <p class="text-2xl font-bold text-slate-800">100</p>
          </div>
          <div class="bg-red-50 p-5 rounded-2xl border border-red-100">
            <p class="text-xs font-bold text-red-500 uppercase mb-2">Wrong</p>
            <p class="text-2xl font-bold text-red-600">03</p>
          </div>
        </div>
      </div>

      <div class="mt-12 pt-8 border-t border-slate-100 flex justify-center">
        <button class="bg-slate-900 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-200 flex items-center gap-2">
          Review Detailed Answers
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>


        <div class="flex gap-4">
            <button class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-semibold hover:bg-gray-800 transition-all shadow-lg shadow-gray-200">
                Review Solutions
            </button>
            <button class="flex-1 bg-white border border-gray-200 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all">
                Retake Test
            </button>
        </div>
    </div>

</body>
</html>
